<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#2374ff"/></marker></defs>
<rect width="1200" height="1080" fill="#f3f7ff"/>
<g font-family="Arial,sans-serif" fill="#123b70"><text x="60" y="65" font-size="34" font-weight="700">ХозОпт. Сценарий покупателя</text><text x="60" y="100" font-size="20">бот. Меню открывается только после обязательной анкеты.</text></g>
<g fill="none" stroke="#2374ff" stroke-width="3" marker-end="url(#arrow)"><path d="M330 215V250M330 315V350M330 415V450M330 515V550M330 615V650M330 715V750M550 282H780M550 582H780M550 782H740V900H780"/></g>
<g fill="white" stroke="#c6d8f2" stroke-width="2"><rect x="110" y="150" width="440" height="65" rx="16"/><rect x="110" y="250" width="440" height="65" rx="16"/><rect x="110" y="350" width="440" height="65" rx="16"/><rect x="110" y="450" width="440" height="65" rx="16"/><rect x="110" y="550" width="440" height="65" rx="16"/><rect x="110" y="650" width="440" height="65" rx="16"/><rect x="110" y="750" width="440" height="65" rx="16"/><rect x="780" y="250" width="350" height="95" rx="16"/><rect x="780" y="550" width="350" height="95" rx="16"/><rect x="780" y="850" width="350" height="155" rx="16"/></g>
<g font-family="Arial,sans-serif" font-size="24" fill="#123b70" text-anchor="middle"><text x="330" y="191">Старт и обещанный результат</text><text x="330" y="291">Согласие</text><text x="330" y="391">1 из 3. Город</text><text x="330" y="491">2 из 3. Имя</text><text x="330" y="591">3 из 3. Телефон</text><text x="330" y="691">Проверка данных</text><text x="330" y="791">Сохранение → Меню</text><text x="955" y="285">Отказ</text><text x="955" y="318" font-size="19">Анкета и меню закрыты</text><text x="955" y="585">Неверный формат</text><text x="955" y="618" font-size="19">Повтор вопроса телефона</text><text x="955" y="887">Уведомление менеджеру</text><text x="955" y="925" font-size="19">Очередь и повтор при ошибке</text><text x="955" y="963" font-size="19">Сохранение ≠ доставка</text></g>
<g font-family="Arial,sans-serif" fill="#123b70"><text x="110" y="875" font-size="23" font-weight="700">Разделы меню</text><text x="110" y="915" font-size="22">Прайс · Заказ · Менеджер</text><text x="110" y="955" font-size="22">О нас · Доставка · Изменить данные</text><text x="110" y="995" font-size="19">Заказ: текст → проверка → номер заявки</text><text x="60" y="1050" font-size="17" fill="#6b7280">Повторный вход продолжает диалог. Стоп останавливает сценарий.</text></g></svg>
